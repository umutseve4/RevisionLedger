[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "revisionledger"
version = "0.1.0"
description = "Bitemporal, provenance-first ledger for economic-data revisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Umut Sever" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/revisionledger"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
