name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-state:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [[ -f data/raw/manifest.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  bootstrap-official-fixtures:
    needs: fixture-state
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.fixture-state.outputs.present == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Fetch bounded ALFRED snapshots and verify locked evidence
        run: python scripts/fetch_fixtures.py
      - name: Commit immutable fixtures and checksums
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "data: add verified ALFRED vintage fixtures"
          git push
      - name: Verify the exact bootstrap commit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format --check .
          ruff check .
          pytest
          echo "VERIFIED_SHA=$(git rev-parse HEAD)"

  format:
    needs: fixture-state
    if: needs.fixture-state.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff==0.11.2
      - run: ruff format --check .

  lint:
    needs: fixture-state
    if: needs.fixture-state.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff==0.11.2
      - run: ruff check .

  pytest:
    needs: fixture-state
    if: needs.fixture-state.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Bind evidence to tested commit
        run: echo "VERIFIED_SHA=$GITHUB_SHA"
