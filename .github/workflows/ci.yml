name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-pytest-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/m1-verification'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/m1-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --junitxml=.ci/pytest-results.xml
      - name: Commit machine-readable test evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/pytest-results.xml
          git commit -m "ci: capture exact pytest evidence"
          git push origin HEAD:chore/m1-verification
