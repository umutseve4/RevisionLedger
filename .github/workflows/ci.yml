name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-ruff-diagnostics:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/m1-verification'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/m1-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.11.2
      - name: Capture exact diagnostics
        shell: bash
        run: |
          mkdir -p .ci
          ruff check . --output-format concise > .ci/ruff-diagnostics.txt 2>&1 || true
          cat .ci/ruff-diagnostics.txt
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/ruff-diagnostics.txt
          git commit -m "ci: capture Ruff diagnostics"
          git push origin HEAD:chore/m1-verification
