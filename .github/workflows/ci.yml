name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require committed official fixtures
        shell: bash
        run: |
          test -f data/raw/manifest.json
          test -f data/raw/gdpc1_2024-01-25.csv
          test -f data/raw/gdpc1_2024-02-28.csv
      - run: python -m pip install -e ".[dev]"
      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/verified-sha.txt
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --junitxml=test-results/pytest.xml
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
