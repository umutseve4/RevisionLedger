name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix-verification-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/m1-verification'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/m1-verification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.11.2
      - name: Apply formatter and safe lint fixes
        run: |
          ruff format .
          ruff check --fix .
      - name: Commit deterministic fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff formatting and safe fixes"
          git push origin HEAD:chore/m1-verification
