name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require committed official fixtures
        shell: bash
        run: |
          test -f data/raw/manifest.json
          test -f data/raw/gdpc1_2024-01-25.csv
          test -f data/raw/gdpc1_2024-02-28.csv
      - run: python -m pip install -e ".[dev]"
      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          mkdir -p test-results
          git rev-parse HEAD | tee test-results/verified-sha.txt
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --junitxml=test-results/pytest.xml
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14
